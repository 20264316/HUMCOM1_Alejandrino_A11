<!DOCTYPE html>
<html>
<head>
<style>
/* MODIFIED: Small-caps line is 20px and uses a different name */
p.normal {
  font-variant: normal;
}
p.small {
  font-variant: small-caps;
  font-size: 20px;
}
</style>
</head>
<body>
<h1>The font-variant property</h1>
<p class="normal">My name is King Queen.</p>
<p class="small">My name is Ralph Alejandrino</p>
</body>
</html>
