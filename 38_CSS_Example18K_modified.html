<!DOCTYPE html>
<html>
<body>
<!-- MODIFIED: Same saturation steps on hue 120 (green) instead of 0 (red) -->
<h1>HSL Saturation</h1>
<p>The second parameter of hsl() defines the saturation. Less saturation mean less color. 0% is
completely gray:</p>
<h2 style="background-color:hsl(120, 100%, 50%);">hsl(120, 100%, 50%)</h2>
<h2 style="background-color:hsl(120, 80%, 50%);">hsl(120, 80%, 50%)</h2>
<h2 style="background-color:hsl(120, 60%, 50%);">hsl(120, 60%, 50%)</h2>
<h2 style="background-color:hsl(120, 40%, 50%);">hsl(120, 40%, 50%)</h2>
<h2 style="background-color:hsl(120, 20%, 50%);">hsl(120, 20%, 50%)</h2>
<h2 style="background-color:hsl(120, 0%, 50%);">hsl(120, 0%, 50%)</h2>
</body>
</html>
