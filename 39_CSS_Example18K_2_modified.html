<!DOCTYPE html>
<html>
<body>
<!-- MODIFIED: Same lightness steps on hue 240 (blue) instead of 0 (red) -->
<h1>HSL Lightness</h1>
<p>The third parameter of hsl() defines the lightness. 0% means black, and 100% means white:</p>
<h2 style="background-color:hsl(240, 100%, 0%);">hsl(240, 100%, 0%)</h2>
<h2 style="background-color:hsl(240, 100%, 25%);">hsl(240, 100%, 25%)</h2>
<h2 style="background-color:hsl(240, 100%, 50%);">hsl(240, 100%, 50%)</h2>
<h2 style="background-color:hsl(240, 100%, 75%);">hsl(240, 100%, 75%)</h2>
<h2 style="background-color:hsl(240, 100%, 90%);">hsl(240, 100%, 90%)</h2>
<h2 style="background-color:hsl(240, 100%, 100%);">hsl(240, 100%, 100%)</h2>
</body>
</html>
