<!DOCTYPE html>
<html>
<head>
<style>
/* MODIFIED: Four sides are now purple, orange, teal and pink */
p.one {
  border-style: solid;
  border-color: purple orange teal pink; /* purple top, orange right, teal bottom and pink left */
}
</style>
</head>
<body>
<h2>The border-color Property</h2>
<p>The border-color property can have from one to four values (for the top border, right border, bottom
border, and the left border):</p>
<p class="one">A solid multicolor border</p>
</body>
</html>
