<!DOCTYPE html>
<html>
<head>
<style>
/* MODIFIED: Italic line is also bold; oblique line is gray */
p.normal {
  font-style: normal;
}
p.italic {
  font-style: italic;
  font-weight: bold;
}
p.oblique {
  font-style: oblique;
  color: gray;
}
</style>
</head>
<body>
<h1>The font-style property</h1>
<p class="normal">This is a paragraph in normal style.</p>
<p class="italic">This is a paragraph in italic style.</p>
<p class="oblique">This is a paragraph in oblique style.</p>
</body>
</html>
