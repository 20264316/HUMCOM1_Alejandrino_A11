<!DOCTYPE html>
<html>
<head>
<style>
/* MODIFIED: p.center is dark orange; added an h2 to show the class only hits <p> */
p.center {
  text-align: center;
  color: darkorange;
}
</style>
</head>
<body>
<h1 class="center">This heading will not be affected</h1>
<h2 class="center">Neither will this h2</h2>
<p class="center">This paragraph will be red and center-aligned.</p>
</body>
</html>
