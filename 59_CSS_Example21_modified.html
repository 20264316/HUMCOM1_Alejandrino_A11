<!DOCTYPE html>
<html>
<head>
<style>
/* MODIFIED: Top margin 30px, left margin 20px, light yellow box */
div {
  border: 1px solid black;
  margin-top: 30px;
  margin-bottom: 100px;
  margin-right: 150px;
  margin-left: 20px;
  background-color: lightyellow;
}
</style>
</head>
<body>
<h2>Using individual margin properties</h2>
<div>This div element has a top margin of 30px, a right margin of 150px, a bottom margin of 100px, and
a left margin of 20px.</div>
</body>
</html>
